name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  suite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            qtdeclarative5-dev-tools \
            ripgrep \
            ruby
          if ! command -v qmllint >/dev/null 2>&1; then
            for dir in /usr/lib/qt6/bin /usr/lib/qt5/bin /usr/lib/qt6/libexec /usr/lib/qt5/libexec; do
              if [[ -x "${dir}/qmllint" ]]; then
                echo "${dir}" >> "${GITHUB_PATH}"
                break
              fi
            done
          fi
          command -v qmllint
          command -v ruby
          command -v jq
          command -v rg
          command -v node
          ruby -e 'require "yaml"'

      - name: ai-cli-control check
        run: LANG=C make -C packages/ai-cli-control check

      - name: kodexbar provider-logic tests
        run: node --test packages/kodexbar/tests/provider-logic.test.js

      - name: kodexbar validate
        run: bash packages/kodexbar/scripts/validate.sh

      - name: root installer tests
        run: python3 tests/test_root_install.py

      - name: shared system package tests
        run: python3 tests/test_system_packaging.py

  python310-engine:
    runs-on: ubuntu-latest
    container: python:3.10-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git bash

      - uses: actions/checkout@v4

      - name: Engine tests on Python 3.10
        run: |
          set -euo pipefail
          python3 -m unittest discover -s packages/ai-cli-control/tests -v
          python3 tests/test_root_install.py
          python3 tests/test_system_packaging.py

  portable-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm-slim
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 git ca-certificates coreutils passwd util-linux bash
          - image: ubuntu:22.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 git ca-certificates coreutils passwd util-linux bash
          - image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 git ca-certificates coreutils passwd util-linux bash
          - image: fedora:latest
            setup: dnf install -y python3 git bash
          - image: archlinux:base
            setup: pacman -Syu --noconfirm --needed python git bash
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install distro tools
        run: ${{ matrix.setup }}

      - uses: actions/checkout@v4

      - name: User-local install without Plasma
        run: |
          set -euo pipefail
          if ! id kodex >/dev/null 2>&1; then
            useradd -m kodex
          fi
          chown -R kodex:kodex "${GITHUB_WORKSPACE}"
          su -s /bin/bash kodex -c "
            set -euo pipefail
            export HOME=/home/kodex
            cd '${GITHUB_WORKSPACE}'
            ./install.sh
            export PATH=\"\$HOME/.local/bin:\$PATH\"
            command -v ai
            command -v kodexbar-quotas
            command -v kodexbar-panel
            command -v kodexbar-tray
            command -v local-ai
            command -v kodexbar-skills
            grep -qx plasma=0 \"\$HOME/.local/state/kodexbar-suite/install-marker\"
            kodexbar-panel --waybar-snippet | grep -F custom/kodexbar
            python3 -m py_compile \"\$HOME/.local/share/ai-cli-control/ai\" \\
              \"\$HOME/.local/share/ai-cli-control/kodexbar-quotas\" \\
              \"\$HOME/.local/share/ai-cli-control/kodexbar-panel\" \\
              \"\$HOME/.local/share/ai-cli-control/kodexbar-tray\" \\
              \"\$HOME/.local/share/ai-cli-control/local-ai\" \\
              \"\$HOME/.local/share/ai-cli-control/kodexbar-skills\"
          "

  native-deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:bookworm-slim
          - name: ubuntu-22.04
            image: ubuntu:22.04
          - name: ubuntu-24.04
            image: ubuntu:24.04
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install DEB build tools
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            coreutils \
            dpkg-dev \
            git \
            python3

      - uses: actions/checkout@v4

      - name: Build and install native DEB
        id: build
        run: |
          set -euo pipefail
          artifact="$(./packaging/deb/build-deb.sh)"
          test -f "$artifact"
          test "$(dpkg-deb --field "$artifact" Package)" = kodexbar-suite
          test "$(dpkg-deb --field "$artifact" Architecture)" = all
          dpkg-deb --contents "$artifact" | grep -F ./usr/bin/kodexbar-quotas
          apt-get install -y "$artifact"
          test "$(readlink /usr/bin/ai)" = ../lib/kodexbar-suite/ai-cli-control/ai
          test "$(head -n 1 /usr/lib/kodexbar-suite/ai-cli-control/ai)" = '#!/usr/bin/env python3'
          version="$(python3 -c 'import json; print(json.load(open("packages/kodexbar/metadata.json"))["KPlugin"]["Version"])')"
          ai --version | grep -F "ai-cli-control $version"
          kodexbar-quotas --version | grep -F "kodexbar-quotas $version"
          kodexbar-panel --waybar-snippet | grep -F custom/kodexbar
          test -f /usr/share/plasma/plasmoids/org.kde.plasma.kodexbar/contents/ui/main.qml
          test -z "$(dpkg -V kodexbar-suite)"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload native DEB
        uses: actions/upload-artifact@v4
        with:
          name: kodexbar-suite-${{ matrix.name }}-deb
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error

  native-rpm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora
            image: fedora:latest
            python: /usr/bin/python3
          - name: almalinux-9
            image: almalinux:9
            python: /usr/bin/python3.11
          - name: almalinux-10
            image: almalinux:10
            python: /usr/bin/python3
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install RPM build tools
        run: |
          set -euo pipefail
          dnf install -y \
            --setopt=install_weak_deps=False \
            bash \
            findutils \
            git \
            gzip \
            python3 \
            rpm-build \
            sed \
            tar

      - uses: actions/checkout@v4

      - name: Build and install native RPM
        id: build
        run: |
          set -euo pipefail
          artifact="$(./packaging/rpm/build-rpm.sh)"
          test -f "$artifact"
          test "$(rpm -qp --queryformat '%{NAME}' "$artifact")" = kodexbar-suite
          test "$(rpm -qp --queryformat '%{ARCH}' "$artifact")" = noarch
          rpm -qpl "$artifact" | grep -F /usr/bin/kodexbar-quotas
          dnf install -y "$artifact"
          test "$(readlink /usr/bin/ai)" = ../lib/kodexbar-suite/ai-cli-control/ai
          test "$(head -n 1 /usr/lib/kodexbar-suite/ai-cli-control/ai)" = '#!${{ matrix.python }}'
          test -x '${{ matrix.python }}'
          version="$(python3 -c 'import json; print(json.load(open("packages/kodexbar/metadata.json"))["KPlugin"]["Version"])')"
          ai --version | grep -F "ai-cli-control $version"
          kodexbar-quotas --version | grep -F "kodexbar-quotas $version"
          kodexbar-panel --waybar-snippet | grep -F custom/kodexbar
          test -f /usr/share/plasma/plasmoids/org.kde.plasma.kodexbar/contents/ui/main.qml
          test -z "$(rpm -V kodexbar-suite)"
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload native RPM
        uses: actions/upload-artifact@v4
        with:
          name: kodexbar-suite-${{ matrix.name }}-rpm
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error

  packaging:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install minimal packages
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git python nodejs

      - uses: actions/checkout@v4

      - name: Prepare non-root builder
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: Verify AUR .SRCINFO files
        run: |
          set -euo pipefail
          runuser -u builder -- bash -euo pipefail -c '
            cd packaging/aur
            makepkg --printsrcinfo | diff -u .SRCINFO -
            echo "packaging/aur .SRCINFO OK"
            cd ../aur-codexbar-cli-bin
            makepkg --printsrcinfo | diff -u .SRCINFO -
            echo "packaging/aur-codexbar-cli-bin .SRCINFO OK"
          '

      - name: Verify plasmoid build reproducibility
        run: |
          set -euo pipefail
          runuser -u builder -- bash -euo pipefail -c '
            bash packaging/kde-store/build-plasmoid.sh
            shopt -s nullglob
            files=(packaging/kde-store/dist/*.plasmoid)
            test "${#files[@]}" -eq 1
            h1="$(sha256sum "${files[0]}" | awk "{print \$1}")"
            bash packaging/kde-store/build-plasmoid.sh
            h2="$(sha256sum "${files[0]}" | awk "{print \$1}")"
            printf "run1=%s\n" "$h1"
            printf "run2=%s\n" "$h2"
            test "$h1" = "$h2"
            echo "plasmoid sha256 reproducible: $h1"
          '
