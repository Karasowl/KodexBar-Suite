name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pyinstaller pystray pillow

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows bundle
        run: pwsh packaging/windows/build.ps1 -Installer

      - name: Publish Windows assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/windows/build/dist/KodexBar-Suite-*-windows-x64.zip
            packaging/windows/build/installer/KodexBar-Suite-*-windows-setup.exe
            packaging/windows/build/dist/SHA256SUMS-windows
          fail_on_unmatched_files: true
