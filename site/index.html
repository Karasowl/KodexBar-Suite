<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KodexBar Suite — Download</title>
  <meta name="description" content="AI quota monitor for Linux. Plasma 6 widget, tray, or Waybar. One command for your desktop." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="https://github.com/Karasowl/KodexBar-Suite">
      <span class="k">K</span>
      <span>KodexBar Suite</span>
    </a>
    <nav>
      <button type="button" id="lang" class="ghost" data-en="ES" data-es="EN">EN</button>
      <a href="https://github.com/Karasowl/KodexBar-Suite">GitHub</a>
      <a href="https://aur.archlinux.org/packages/kodexbar-suite">AUR</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow" data-es="Linux · Plasma 6, bandeja o Waybar" data-en="Linux · Plasma 6, tray, or Waybar">Linux · Plasma 6, bandeja o Waybar</p>
    <h1 data-es="Cuotas de IA en tu barra. Un comando." data-en="AI quotas on your bar. One command.">Cuotas de IA en tu barra. Un comando.</h1>
    <p class="lede" data-es="No hay un widget nativo de GNOME. Instalamos lo que tu escritorio sí puede correr." data-en="There is no native GNOME applet. We install what your desktop can actually run.">No hay un widget nativo de GNOME. Instalamos lo que tu escritorio sí puede correr.</p>

    <section class="card primary" id="action">
      <p class="hint" id="detected"></p>
      <h2 id="action-title"></h2>
      <p id="action-body"></p>
      <pre><code id="action-cmd"></code></pre>
      <div class="row">
        <button type="button" id="copy" class="btn" data-es="Copiar comando" data-en="Copy command">Copiar comando</button>
        <a class="btn ghost" href="https://github.com/Karasowl/KodexBar-Suite#install-the-suite" data-es="Guía completa" data-en="Full guide">Guía completa</a>
      </div>
    </section>

    <p class="choose-label" data-es="¿Otro escritorio?" data-en="Different desktop?">¿Otro escritorio?</p>
    <div class="pills" id="pills">
      <button type="button" data-id="arch">Arch / CachyOS</button>
      <button type="button" data-id="plasma">Plasma 6</button>
      <button type="button" data-id="gnome">GNOME / COSMIC</button>
      <button type="button" data-id="waybar">Hyprland / Waybar</button>
      <button type="button" data-id="xfce">XFCE</button>
      <button type="button" data-id="other">Otro</button>
    </div>

    <figure class="demo">
      <img src="https://raw.githubusercontent.com/Karasowl/KodexBar-Suite/main/docs/kodexbar-demo.gif" alt="KodexBar on Plasma 6" width="554" height="492" />
      <figcaption><a href="https://github.com/Karasowl/KodexBar-Suite/blob/main/docs/kodexbar-demo.mp4" data-es="Clip de 26s" data-en="26s clip">Clip de 26s</a></figcaption>
    </figure>
  </main>

  <footer>
    <a href="https://github.com/Karasowl/KodexBar-Suite/releases/latest" data-es="Release .plasmoid" data-en=".plasmoid release">Release .plasmoid</a>
    <span>·</span>
    <a href="https://github.com/Karasowl/KodexBar-Suite">Karasowl/KodexBar-Suite</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
